<!doctype html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coup – รัฐประหาร</title>
<style>
:root{--bg:#14161f;--fg:#f1f1f5;--pn:#222638;--mut:#8b90a6;--ac:#f5b942;--bad:#e5564b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="light"]){}}
@media(prefers-color-scheme:light){:root{--bg:#f3f1ea;--fg:#1d1f2b;--pn:#fff;--mut:#6b6f80;color-scheme:light}}
:root[data-theme="dark"]{--bg:#14161f;--fg:#f1f1f5;--pn:#222638;--mut:#8b90a6;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.35 system-ui,"Noto Sans Thai",sans-serif;display:flex;flex-direction:column;overflow:hidden}
#top{text-align:center;color:var(--mut);padding:6px;font-size:13px}
#opps{display:flex;gap:6px;padding:0 8px;overflow-x:auto}
.op{flex:1;min-width:84px;background:var(--pn);border-radius:12px;padding:6px;text-align:center;border:2px solid transparent;font-size:13px}
.op.turn{border-color:var(--ac)}.op.dead{opacity:.35}
.op span{display:block;color:var(--ac)}
.op i{display:inline-block;font-style:normal;width:30px;height:40px;line-height:40px;margin:3px 2px 0;border-radius:6px;font-size:18px}
.op i.b{background:#3a4066;color:#fff}.op i.r{background:#8883;outline:1px dashed var(--bad)}
#log{flex:1;overflow-y:auto;padding:8px 14px;font-size:13px;color:var(--mut)}
#log div{padding:2px 0}#log div:last-child{color:var(--fg);font-weight:600}
#me{display:flex;align-items:center;justify-content:center;gap:12px;padding:6px}
.cards{display:flex;gap:10px}
.cd{width:88px;min-height:96px;background:var(--pn);border:2px solid var(--ac);border-radius:12px;padding:10px 4px;text-align:center;font-size:14px;color:var(--fg);font-family:inherit}
.cd.rev{opacity:.4;border-color:var(--bad)}.cd.sel{background:var(--ac);color:#111}
.coins{font-size:22px;color:var(--ac);font-weight:700}
#acts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px 8px 10px}
button{font:inherit;color:var(--fg);background:var(--pn);border:1px solid #8885;border-radius:12px;padding:11px 4px;font-size:14px}
button:disabled{opacity:.3}
#sheet{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:9}
#sheet.on{display:flex}
.sh{width:100%;background:var(--bg);padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));border-radius:18px 18px 0 0;display:flex;flex-direction:column;gap:8px;border-top:2px solid var(--ac)}
.sh p{text-align:center;font-weight:600}.row{display:flex;gap:8px;justify-content:center}
:root{--glow:#2c3260}@media(prefers-color-scheme:light){:root{--glow:#fff}}
body{background:radial-gradient(120% 60% at 50% 0,var(--glow),var(--bg) 75%)}
.coin{display:inline-block;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#f5b942 55%,#b8860b);border:1px solid #8a5b00;vertical-align:-2px;margin-right:3px}
.coins .coin{width:24px;height:24px;margin-right:6px;vertical-align:-5px}
.cd{position:relative;width:96px;height:136px;min-height:0;padding:0;overflow:hidden;display:flex;flex-direction:column;background:linear-gradient(160deg,var(--c),#0009);border:3px solid #f5b942;border-radius:14px;box-shadow:0 6px 16px #0007,inset 0 0 20px #fff3;color:#fff}
.cd .art{flex:1;min-height:0;background:radial-gradient(circle at 50% 38%,#fff5,transparent 62%)}
.cd .art svg{width:100%;height:100%;display:block}
.cd b{display:block;text-align:center;font-size:13px;padding:4px 0;background:#0007;letter-spacing:.5px}
.cd.sel{background:linear-gradient(160deg,var(--c),#0009);color:#fff;transform:translateY(-10px);box-shadow:0 0 0 3px #fff,0 0 22px var(--ac)}
.cd.rev{filter:grayscale(1) brightness(.6)}
.cd.rev::after{content:"✖";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:42px;color:#ff5a4d;background:#0005}
.cd.mini{width:34px;height:48px;border-width:2px;border-radius:7px;box-shadow:0 2px 5px #0006}
.mini b{display:none}.mini.rev::after{font-size:18px}
.cd.back{background:repeating-linear-gradient(45deg,#3a4066,#3a4066 4px,#4d5690 4px,#4d5690 8px)}
.op{position:relative;background:linear-gradient(var(--pn),color-mix(in srgb,var(--pn),#888 18%));box-shadow:0 4px 10px #0005}
.av{font-size:26px;width:46px;height:46px;line-height:42px;border-radius:50%;margin:0 auto 2px;background:radial-gradient(#fff4,#0005);border:2px solid var(--ac)}
.op .mc{display:flex;justify-content:center;gap:4px;margin-top:5px}
.op.turn{animation:pulse 1.2s infinite}.turnme{animation:glow 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 16px var(--ac)}}@keyframes glow{50%{box-shadow:0 0 20px var(--ac),0 6px 16px #0007}}
.flipin{animation:flip .6s}@keyframes flip{from{transform:rotateY(90deg) scale(1.15)}}
.deal{animation:deal .55s backwards}@keyframes deal{from{transform:translateY(90px) rotate(-14deg) scale(.4);opacity:0}}
.shake{animation:shake .45s}@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
body.hit::after{content:"";position:fixed;inset:0;background:#e5564b66;pointer-events:none;animation:fade .45s forwards}@keyframes fade{to{opacity:0}}
#ban{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;z-index:8;font-size:24px;font-weight:800;text-align:center;padding:14px 22px;border-radius:18px;background:#000d;color:#fff;border:2px solid var(--ac);max-width:90%}
#ban.bad{border-color:var(--bad)}#ban.on{animation:ban 2.2s forwards}
@keyframes ban{15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%) scale(1)}}
.fl{position:fixed;z-index:7;font-weight:800;font-size:24px;pointer-events:none;animation:fl 1.1s forwards;transform:translateX(-50%);text-shadow:0 2px 4px #000}.fl.up{color:#ffd54a}.fl.dn{color:#ff6b5e}
@keyframes fl{from{opacity:1}to{transform:translate(-50%,-56px);opacity:0}}
#acts button{background:linear-gradient(var(--pn),color-mix(in srgb,var(--pn),#888 22%));border:1px solid #f5b94277;box-shadow:0 3px 0 #0006;transition:transform .1s}#acts button:active{transform:translateY(3px);box-shadow:none}
</style></head><body>
<div id="top">Coup</div><div id="opps"></div><div id="log"></div>
<div id="me"></div>
<div id="acts">
<button data-t="inc">รายได้ +1</button><button data-t="aid">ช่วยเหลือ +2</button><button data-t="coup">รัฐประหาร −7</button>
<button data-t="tax">👑 ภาษี +3</button><button data-t="ass">🗡️ ลอบสังหาร −3</button><button data-t="steal">⚓ ขโมย 2</button>
<button data-t="ex" style="grid-column:2">🎩 แลกไพ่</button></div>
<div id="sheet"></div>
<script>
const $=s=>document.querySelector(s);
const CH={D:['ดยุก','👑'],A:['นักฆ่า','🗡️'],C:['กัปตัน','⚓'],M:['ทูต','🎩'],T:['คอนเตสซา','🛡️']};
const AL={inc:'รายได้',aid:'ความช่วยเหลือต่างชาติ',coup:'รัฐประหาร',tax:'เก็บภาษี',ass:'ลอบสังหาร',steal:'ขโมย',ex:'แลกไพ่'};
const ACT={inc:{},aid:{},coup:{cost:7,tg:1},tax:{ch:'D'},ass:{cost:3,ch:'A',tg:1},steal:{ch:'C',tg:1},ex:{ch:'M'}};
let P,deck,cur,actRes,curT;
const sleep=ms=>new Promise(r=>setTimeout(r,ms*4.5));
const rnd=a=>a[Math.random()*a.length|0];
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const live=p=>p.cards.filter(c=>!c.rev),alive=()=>P.filter(p=>p.alive),idx=p=>P.indexOf(p);
const nm=c=>CH[c][1]+CH[c][0];
function order(f){const r=[];for(let i=1;i<P.length;i++){const q=P[(f+i)%P.length];if(q.alive)r.push(q)}return r}
function say(t){const l=$('#log'),d=document.createElement('div');d.textContent=t;l.append(d);l.scrollTop=l.scrollHeight}
function ask(t,o){return new Promise(r=>{const s=$('#sheet');s.innerHTML=`<div class="sh"><p>${t}</p>${o.map((x,i)=>`<button data-i="${i}">${x}</button>`).join('')}</div>`;s.className='on';s.onclick=e=>{const b=e.target.closest('button');if(!b)return;s.className='';s.innerHTML='';r(+b.dataset.i)}})}
function askKeep(cs,k){return new Promise(r=>{const sel=new Set(),s=$('#sheet');const draw=()=>{s.innerHTML=`<div class="sh"><p>แลกไพ่: เลือกเก็บ ${k} ใบ (ที่เหลือคืนกอง)</p><div class="row">${cs.map((c,i)=>`<button data-i="${i}" class="cd ${sel.has(i)?'sel':''}" style="--c:${COL[c]}"><div class="art">${ART[c]}</div><b>${CH[c][0]}</b></button>`).join('')}</div><button id="ok" ${sel.size==k?'':'disabled'}>ยืนยัน</button></div>`};draw();s.className='on';s.onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.id=='ok'){s.className='';s.innerHTML='';r([...sel]);return}const i=+b.dataset.i;sel.has(i)?sel.delete(i):sel.size<k&&sel.add(i);draw()}})}
function setActs(on){const m=P[0];document.querySelectorAll('#acts button').forEach(b=>{const t=b.dataset.t,d=ACT[t];let ok=on;if(ok){if(m.coins>=10)ok=t=='coup';else if(d.cost&&m.coins<d.cost)ok=false}b.disabled=!ok})}
function render(){
$('#top').textContent=`กองไพ่ ${deck.length} ใบ · เหรียญกลาง ${Math.max(0,50-P.reduce((a,p)=>a+p.coins,0))}`;
$('#opps').innerHTML=P.filter(p=>!p.human).map(p=>`<div class="op ${P[cur]===p?'turn':''} ${p.alive?'':'dead'}"><b>${p.name}</b><span>🪙 ${p.coins}</span>${p.cards.map(c=>c.rev?`<i class="r">${CH[c.c][1]}</i>`:'<i class="b">?</i>').join('')}</div>`).join('');
const m=P[0];
$('#me').innerHTML=`<div class="cards">${m.cards.map(c=>`<div class="cd ${c.rev?'rev':''}">${CH[c.c][1]}<br>${CH[c.c][0]}${c.rev?'<br><small>เสียแล้ว</small>':''}</div>`).join('')}</div><div class="coins">🪙 ${m.coins}</div>`}
$('#acts').onclick=async e=>{const b=e.target.closest('button');if(!b||b.disabled||!actRes)return;const t=b.dataset.t;let tg=null;
if(ACT[t].tg){const o=alive().filter(p=>p!==P[0]);const i=await ask(`เลือกเป้าหมาย: ${AL[t]}`,o.map(p=>p.name).concat('ยกเลิก'));if(i==o.length)return;tg=o[i].n}
const r=actRes;actRes=null;setActs(false);r({t,tg})};
async function lose(p){
if(!p.alive)return;const l=live(p);let c=l[0];
if(l.length>1){if(p.human){const i=await askP(p,'คุณเสียอิทธิพล 1 ใบ เลือกใบที่จะเปิด',l.map(x=>nm(x.c)));c=l[i]}else c=rnd(l)}
c.rev=true;say(`${p.name} เสียอิทธิพล: เปิด ${nm(c.c)}`);
if(!live(p).length){p.alive=false;p.coins=0;say(`💀 ${p.name} ถูกเนรเทศ`)}
render();await sleep(600)}
function botChal(q,cl,ch){
const k=P.reduce((a,p)=>a+p.cards.filter(c=>c.rev&&c.c===ch).length,0)+live(q).filter(c=>c.c===ch).length;
if(k>=3)return true;
const tgd=q===curT&&ch==='A';let pr=.1+(k==2?.15:0)+(tgd?.25:0);
if(live(q).length==1&&!tgd)pr*=.5;return Math.random()<pr}
// คืน true ถ้าผู้อ้างพิสูจน์ไม่ได้ (แพ้การท้าทาย)
async function chal(cl,ch){
for(const q of order(idx(cl))){
let y;
if(q.human)y=await askP(q,`${cl.name} อ้างว่ามี ${nm(ch)} — ท้าทายไหม?`,['ท้าทาย!','ปล่อยผ่าน'])==0;
else{await sleep(350);y=botChal(q,cl,ch)}
if(y){say(`⚔️ ${q.name} ท้าทาย ${cl.name}!`);await sleep(500);
const c=live(cl).find(x=>x.c===ch);
if(c){say(`${cl.name} โชว์ ${nm(ch)} — ชนะการท้าทาย (จั่วไพ่ใหม่แทน)`);deck.push(c.c);shuf(deck);c.c=deck.pop();render();await lose(q);return false}
say(`${cl.name} พิสูจน์ไม่ได้ — แพ้การท้าทาย`);await lose(cl);return true}}
return false}
async function getBlock(a,p,tg){
const ord=a.t=='aid'?order(idx(p)):[tg],opts=a.t=='aid'?['D']:a.t=='ass'?['T']:['M','C'];
for(const q of ord){let ch=null;
if(q.human){const i=await askP(q,`${p.name}: ${AL[a.t]}${a.t=='aid'?'':' (เป้าหมายคือคุณ)'} — จะบล็อกไหม?`,opts.map(o=>'บล็อกด้วย '+nm(o)).concat('ปล่อยผ่าน'));if(i<opts.length)ch=opts[i]}
else{await sleep(300);const has=opts.find(o=>live(q).some(c=>c.c===o));
if(has)ch=Math.random()<.92?has:null;else{const bp=a.t=='aid'?.12:a.t=='ass'?(live(q).length==1?.7:.3):.2;if(Math.random()<bp)ch=rnd(opts)}}
if(ch)return{q,ch}}
return null}
function botAction(p){
const o=order(idx(p)),l=live(p).map(c=>c.c),has=c=>l.includes(c);
const rich=[...o].sort((a,b)=>(b.coins+live(b).length*2)-(a.coins+live(a).length*2)||Math.random()-.5)[0],tgi=idx(rich);
if(p.coins>=10||(p.coins>=7&&Math.random()<.75))return{t:'coup',tg:tgi};
const w=[['inc',1],['aid',2],['tax',has('D')?5:1.5],['ex',has('M')?2:.6]];
if(p.coins>=3)w.push(['ass',has('A')?5:1]);
const st=o.filter(q=>q.coins>0).sort((a,b)=>b.coins-a.coins);if(st.length)w.push(['steal',has('C')?3.5:1]);
let r=Math.random()*w.reduce((a,x)=>a+x[1],0),t='inc';for(const x of w){r-=x[1];if(r<=0){t=x[0];break}}
let tg=null;if(ACT[t].tg)tg=t=='steal'?idx(st[0]):tgi;
return{t,tg}}
async function exch(p){
const d=[deck.pop(),deck.pop()],l=live(p),pool=l.map(c=>c.c).concat(d),k=l.length;let keep;
if(p.human)keep=await askPK(p,pool,k);
else{const pr={D:5,C:4,A:3,T:3,M:2};keep=pool.map((c,i)=>[i,pr[c]+Math.random()]).sort((a,b)=>b[1]-a[1]).slice(0,k).map(x=>x[0])}
const kept=keep.map(i=>pool[i]);pool.forEach((c,i)=>{if(!keep.includes(i))deck.push(c)});
l.forEach((c,i)=>c.c=kept[i]);shuf(deck)}
async function doAction(p,a){
const d=ACT[a.t],tg=a.tg!=null?P[a.tg]:null;
if(d.cost)p.coins-=d.cost;
say(`${p.name}: ${AL[a.t]}${tg?' → '+tg.name:''}${d.ch?` (อ้างว่ามี ${nm(d.ch)})`:''}`);render();await sleep(500);
if(a.t=='coup'){await lose(tg);return}
curT=tg;
if(d.ch&&await chal(p,d.ch)){if(d.cost)p.coins+=d.cost;say('การกระทำล้มเหลว'+(d.cost?' (คืนเหรียญ)':''));render();return}
if(tg&&!tg.alive)return;
if(['aid','ass','steal'].includes(a.t)){
const b=await getBlock(a,p,tg);
if(b){say(`🚫 ${b.q.name} อ้างว่ามี ${nm(b.ch)} เพื่อบล็อก`);
if(!await chal(b.q,b.ch)){say('บล็อกสำเร็จ — การกระทำล้มเหลว');render();return}
if(tg&&!tg.alive)return}}
if(a.t=='inc')p.coins++;else if(a.t=='aid')p.coins+=2;else if(a.t=='tax')p.coins+=3;
else if(a.t=='steal'){const n=Math.min(2,tg.coins);tg.coins-=n;p.coins+=n;say(`${p.name} ขโมย ${n} เหรียญจาก ${tg.name}`)}
else if(a.t=='ass')await lose(tg);
else if(a.t=='ex'){await exch(p);say(`${p.name} แลกไพ่กับกอง`)}
render()}
async function game(n,H=[]){
deck=shuf(['D','A','C','M','T'].flatMap(c=>[c,c,c]));
P=[{name:NET.role=='h'?'ผู้เล่น 1':'คุณ',human:1}].concat(H.map(h=>({name:h.name,human:1,conn:h.conn})),Array.from({length:n-1-H.length},(_,i)=>({name:'บอท '+(i+1),av:['🦊','🐺','🐯','🦉','🐲'][i]})));
P.forEach((p,i)=>{p.n=i;p.cards=[{c:deck.pop()},{c:deck.pop()}];p.coins=2;p.alive=true});
cur=Math.random()*n|0;if(n==2)P[cur].coins=1;
while(alive().length>1){
const p=P[cur];render();say(`— ตาของ ${p.name} —`);let a;
if(p.human){a=await getMove(p)}else{await sleep(700);a=botAction(p)}
await doAction(p,a);
if(alive().length<2)break;
do{cur=(cur+1)%n}while(!P[cur].alive)}
render();const w=alive()[0];say(`🏆 ${w.name} ชนะ`);
await ask(w===P[0]?'🏆 คุณชนะ! เป็นผู้รอดชีวิตคนสุดท้าย':`${w.name} ชนะ — คุณถูกเนรเทศ`,['เล่นอีกครั้ง']);location.reload()}
const MENU0=()=>ask('Coup — รัฐประหาร\nเลือกจำนวนผู้เล่น (รวมคุณ)',['2 คน','3 คน','4 คน','5 คน','6 คน']).then(i=>{
P=[{coins:0}];deck=[];cur=0;setActs(false);game(i+2)});
</script>
<script>
const COL={D:'#7b46b8',A:'#444a66',C:'#2563a8',M:'#1f8a5b',T:'#c0392b'};
const B='<path d="M6 70Q8 48 30 46Q52 48 54 70Z" fill="';
const ART={
D:`<svg viewBox="0 0 60 70">${B}#7b46b8"/><path d="M19 47Q30 58 41 47L39 55Q30 62 21 55Z" fill="#f5f0e6"/><circle cx="30" cy="32" r="11" fill="#f2c9a0"/><path d="M19 24L21 9L26 17L30 7L34 17L39 9L41 24Z" fill="#f5b942" stroke="#b8860b"/><circle cx="26" cy="32" r="1.6"/><circle cx="34" cy="32" r="1.6"/><path d="M23 37Q30 48 37 37Q30 41 23 37Z" fill="#e8e8e8"/></svg>`,
A:`<svg viewBox="0 0 60 70">${B}#2b2b3a"/><path d="M30 5Q9 10 14 38Q20 47 30 47Q40 47 46 38Q51 10 30 5Z" fill="#1c1c28"/><ellipse cx="30" cy="31" rx="9" ry="8" fill="#08080e"/><circle cx="26" cy="30" r="2" fill="#ff3b3b"/><circle cx="34" cy="30" r="2" fill="#ff3b3b"/><path d="M46 38L53 62L50 63L43 40Z" fill="#d5dbe6"/><rect x="41" y="37" width="9" height="3" fill="#b8860b"/></svg>`,
